<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>X32 Fernsteuerung</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="design-plain.css" />
</head>
<body class="plain">
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="5.4" fill="#26272b"/><g fill="#43454b"><rect x="6.47" y="5.01" width="0.76" height="13.98" rx="0.38"/><rect x="11.62" y="5.01" width="0.76" height="13.98" rx="0.38"/><rect x="16.78" y="5.01" width="0.76" height="13.98" rx="0.38"/></g><rect x="4.72" y="9.9" width="4.25" height="2.45" rx="0.58" fill="#e9e9ec"/><rect x="5.42" y="11.01" width="2.85" height="0.23" rx="0.12" fill="#26272b" fill-opacity="0.55"/><rect x="9.87" y="6.87" width="4.25" height="2.45" rx="0.58" fill="#0A84FF"/><rect x="10.57" y="7.98" width="2.85" height="0.23" rx="0.12" fill="#ffffff" fill-opacity="0.75"/><rect x="15.03" y="13.05" width="4.25" height="2.45" rx="0.58" fill="#e9e9ec"/><rect x="15.73" y="14.16" width="2.85" height="0.23" rx="0.12" fill="#26272b" fill-opacity="0.55"/></svg>
      <span class="brand-text">X32 <b>Fernsteuerung</b></span>
      <span id="version-label" class="version-label"></span>
      <button id="design-btn" class="design-toggle" title="Design umschalten">Design: Schlicht</button>
    </div>
    <div class="conn-row">
      <button id="rew-btn" class="btn secondary small" title="Messsoftware REW starten">REW öffnen</button>
      <button id="offline-btn" class="btn secondary small">Offline-Modus</button>
      <button id="scan-btn" class="btn secondary small">Pult suchen</button>
      <input id="ip-input" type="text" placeholder="192.168.0.64" />
      <button id="connect-btn" class="btn small">Verbinden</button>
      <div id="status-badge" class="badge"><span id="pulse-dot" class="pulse-dot"></span><span id="status-text">nicht verbunden</span></div>
    </div>
  </header>

  <nav id="layer-tabs" class="layer-tabs"></nav>
  <section id="overview" class="overview" aria-label="Übersicht"></section>
  <div id="console" class="console offline">
    <main id="app" class="app"></main>
    <aside id="dock" class="dock" aria-label="Main"></aside>
    <div id="connect-hint" class="connect-hint">
      <div class="hint-title">Nicht mit einem Pult verbunden</div>
      <p>Mac und X32 müssen im selben Netzwerk sein (z. B. im WLAN des Pult-Routers).</p>
      <button id="hint-scan-btn" class="btn">Pult suchen</button>
      <button id="hint-offline-btn" class="btn secondary">Offline arbeiten</button>
      <label class="auto-row"><input id="auto-connect" type="checkbox" checked> Beim Start automatisch suchen und verbinden</label>
    </div>
  </div>

  <section id="tools" class="tools" hidden aria-label="Werkzeuge"></section>

  <script src="../shared/values.js"></script>
  <script src="../shared/spl.js"></script>
  <script src="../shared/calc.js"></script>
  <script src="../shared/eqmath.js"></script>
  <script src="icons.js"></script>
  <script src="store.js"></script>
  <script src="fader.js"></script>
  <script src="minis.js"></script>
  <script src="userpage.js"></script>
  <script src="measure.js"></script>
  <script src="tools.js"></script>
  <script src="overview.js"></script>
  <script src="changelog.js"></script>
  <script src="app.js"></script>
  <script src="scenes.js"></script>
  <script src="offline.js"></script>
  <script src="processing.js"></script>
</body>
</html>
