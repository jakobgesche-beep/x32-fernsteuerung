<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>X32 Fernsteuerung</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text">X32 <b>Fernsteuerung</b></span>
      <span id="version-label" class="version-label"></span>
    </div>
    <div class="conn-row">
      <button id="scan-btn" class="btn secondary small">Pult suchen</button>
      <input id="ip-input" type="text" placeholder="192.168.0.64" />
      <button id="connect-btn" class="btn small">Verbinden</button>
      <div id="status-badge" class="badge"><span id="pulse-dot" class="pulse-dot"></span><span id="status-text">nicht verbunden</span></div>
    </div>
  </header>

  <nav id="layer-tabs" class="layer-tabs"></nav>
  <div id="console" class="console offline">
    <main id="app" class="app"></main>
    <aside id="dock" class="dock" aria-label="Main"></aside>
    <div id="connect-hint" class="connect-hint">
      <div class="hint-title">Nicht mit einem Pult verbunden</div>
      <p>Mac und X32 müssen im selben Netzwerk sein (z. B. im WLAN des Pult-Routers).</p>
      <button id="hint-scan-btn" class="btn">Pult suchen</button>
    </div>
  </div>

  <script src="../shared/values.js"></script>
  <script src="icons.js"></script>
  <script src="store.js"></script>
  <script src="fader.js"></script>
  <script src="app.js"></script>
  <script src="processing.js"></script>
</body>
</html>
