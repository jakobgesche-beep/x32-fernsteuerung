name: Windows probe
on:
  push:
    branches: [win-probe]
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Netzwerk-Befehle
        shell: cmd
        run: |
          echo ==== ver & ver
          echo ==== chcp & chcp
          echo ==== ping localhost & ping -n 2 -w 1000 127.0.0.1
          echo ==== ipconfig & ipconfig
          echo ==== route print -4 & route print -4
          echo ==== arp -a & arp -a
          echo ==== netsh profile & netsh advfirewall show currentprofile
          echo ==== where & where ping arp route netsh powershell control
      - name: PowerShell Netzwerk
        shell: pwsh
        run: |
          "---- Get-NetRoute default"; Get-NetRoute -DestinationPrefix 0.0.0.0/0 | Format-List NextHop,InterfaceAlias,RouteMetric
          "---- Get-NetNeighbor"; Get-NetNeighbor -AddressFamily IPv4 | Select-Object -First 5 | Format-Table
          "---- Get-NetConnectionProfile"; Get-NetConnectionProfile | Format-List Name,NetworkCategory,InterfaceAlias
          "---- Firewall profile"; Get-NetFirewallProfile | Format-Table Name,Enabled,DefaultInboundAction
          "---- os.networkInterfaces"; node -e "console.log(JSON.stringify(require('os').networkInterfaces(),null,1))"
          "---- Programme"; Get-ChildItem 'C:\Program Files' | Select-Object -First 30 Name
          "---- Ping Schleife"; ping -n 2 -w 1000 10.255.255.1
