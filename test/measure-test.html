<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../renderer/style.css">
<style>body{padding:10px;} pre#out{display:none;}</style></head><body>
<button id="rew-btn" class="btn secondary small">REW öffnen</button>
<section id="measure"></section>
<pre id="out"></pre>
<script>try { localStorage.clear(); } catch (e) {}</script>
<script src="../shared/spl.js"></script>
<script>
// Messung, Ende zu Ende: echte Aufnahme-Kette (getUserMedia -> Web Audio -> Rechnung -> Anzeige) mit einem simulierten
// Mikrofon (Chrome-Testgerät spielt eine WAV-Datei: links 1 kHz mit -23,0 dBFS, rechts 6 dB leiser).
// Muss in Echtzeit laufen (nicht mit virtueller Zeit); der Server auf Port 8811 hält die Seite bis zum Ergebnis offen.
window.__calls = [];
window.x32API = {
  micStatus: async () => 'granted', micRequest: async () => 'granted', openMicSettings: async () => true,
  rewStatus: async () => ({ found: true, path: '/Applications/REW.app' }),
  rewOpen: async () => { window.__calls.push('rewOpen'); return { ok: true }; },
  rewChoose: async () => { window.__calls.push('rewChoose'); return { ok: true, path: '/x/REW.app' }; },
  rewDownload: async () => { window.__calls.push('rewDownload'); return true; },
  saveTextFile: async (name, text) => { window.__saved = { name, text }; return { ok: true, path: '/tmp/' + name }; },
};
window.toast = (m) => { window.__toasts = (window.__toasts || []).concat(m); };
</script>
<script src="../renderer/measure.js"></script>
<script>
const out = []; let fails = 0;
const params = new URLSearchParams(location.search);
function check(name, ok, detail){ if(!ok) fails++; out.push((ok ? 'OK    ' : 'FAIL  ') + name + (detail !== undefined ? '  ' + detail : '')); }
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(cond, ms){ const t0 = performance.now(); while(performance.now() - t0 < (ms || 20000)){ if(cond()) return true; await sleep(40); } return false; }
const $ = (id) => document.getElementById(id);
const st = () => Measure.debug().S;
const seconds = () => (st().meter ? st().meter.total / st().fs : 0);
const num = (id) => parseFloat($(id).textContent.replace(',', '.'));
const near = (a, b, tol) => Math.abs(a - b) <= tol;

(async () => {
  try {
    $('rew-btn').addEventListener('click', () => Measure.openRew());
    Measure.init($('measure'));
    await Measure.show();
    check('Seite aufgebaut: Eingang, Kanal, Start, Zahnrad, Kalibrierung, REW-Programm vorhanden', !!($('m-device') && $('m-channel') && $('m-start') && $('m-gear') && $('m-cal') && $('m-rew-choose')) && $('m-settings').hidden);
    check('REW gefunden: Pfad wird in den Einstellungen angezeigt, Download-Knopf verborgen', /REW\.app/.test($('m-rew-info').textContent) && $('m-rew-dl').hidden, $('m-rew-info').textContent);
    check('Gerätelisten: mindestens ein Eingang', $('m-device').options.length >= 1 && $('m-device').value !== '', Array.from($('m-device').options).map((o) => o.textContent).join(' | '));

    // ---- Messung starten ----
    await Measure.start();
    check('Messung läuft, Aufnahme über AudioWorklet', st().running && st().cap && st().cap.mode === 'worklet', st().cap && st().cap.mode);
    check('Start-Knopf zeigt "Stopp"', /Stopp/.test($('m-start').textContent));
    const gotAudio = await until(() => seconds() >= 3.5, 20000);
    check('Audiodaten kommen an (mindestens 3,5 s in Echtzeit)', gotAudio, seconds().toFixed(2) + ' s, ' + st().fs + ' Hz');
    check('Abtastrate plausibel', [44100, 48000, 88200, 96000].includes(st().fs), String(st().fs));
    await sleep(300);
    check('Anzeige unkalibriert: Einheit dBFS(A)', /dBFS\(A\)/.test($('m-unit').textContent), $('m-unit').textContent);
    check('Kalibrier-Hinweis: "nicht kalibriert"', /nicht/.test($('m-cal-badge').textContent));
    const v0 = num('m-value');
    check('Pegel Kanal 1 = -23,0 dBFS (Testton -20 dBFS Spitze)', near(v0, -23.01, 0.6), 'angezeigt ' + v0);
    check('Max und Leq 30 min werden angezeigt', near(num('m-max'), -23.01, 0.6) && isFinite(num('m-leq30')), 'Max ' + num('m-max') + ', Leq30 ' + num('m-leq30'));
    check('Leq 30 min zeigt Wert und Dauer', isFinite(num('m-leq30')) && /s|min/.test($('m-leq30-s').textContent), $('m-leq30').textContent + ' ' + $('m-leq30-s').textContent);
    check('Balken folgt dem Pegel (nicht leer, nicht voll)', parseFloat($('m-bar-fill').style.left) > 30 && parseFloat($('m-bar-fill').style.left) < 100, $('m-bar-fill').style.left);
    check('Kanäle: Auswahl passt zur Anzahl', $('m-channel').options.length >= 1, 'Kanäle ' + st().channels + ', Optionen ' + $('m-channel').options.length);

    // ---- Spektrum ----
    const gotRta = await until(() => !!st().levels, 8000);
    check('Spektrum rechnet', gotRta);
    if(gotRta){
      const lv = st().levels, mx = Math.max(...lv), pk = lv.indexOf(mx);
      check('stärkstes Terzband = 1 kHz mit -23 dBFS', pk === 17 && near(mx, -23.01, 0.8), 'Band ' + X32SPL.THIRD_OCTAVE_LABELS[pk] + ', ' + mx.toFixed(2));
    }

    // ---- Zweiter Kanal (6 dB leiser) ----
    if(st().channels >= 2){
      $('m-channel').value = '1'; $('m-channel').dispatchEvent(new Event('change', { bubbles: true }));
      await until(() => seconds() >= 3, 12000); await sleep(200);
      check('Kanal 2 = -29,0 dBFS (6 dB leiser)', near(num('m-value'), -29.03, 0.7), 'angezeigt ' + num('m-value'));
      $('m-channel').value = '-1'; $('m-channel').dispatchEvent(new Event('change', { bubbles: true }));
      await until(() => seconds() >= 3, 12000); await sleep(200);
      check('Alle Kanäle gemittelt = -24,4 dBFS', near(num('m-value'), 10 * Math.log10(((0.1 + 0.05) / 2) ** 2 / 2), 0.8), 'angezeigt ' + num('m-value'));
      $('m-channel').value = '0'; $('m-channel').dispatchEvent(new Event('change', { bubbles: true }));
      await until(() => seconds() >= 3.5, 12000);
    } else out.push('--    (Testgerät liefert nur 1 Kanal: Kanalwahl übersprungen)');


    // ---- Kalibrieren ----
    $('m-ref').value = '94'; $('m-ref').dispatchEvent(new Event('change', { bubbles: true }));
    $('m-cal').click();
    check('Kalibrieren gestartet: Knopf gesperrt', $('m-cal').disabled);
    const calDone = await until(() => !st().calibrating, 15000);
    check('Kalibrierung fertig (3 s Messung)', calDone, $('m-cal').textContent);
    await sleep(500);
    const cals = JSON.parse(localStorage.getItem('x32.measure.cal') || '{}');
    const off = Object.values(cals)[0];
    check('Offset gespeichert: 94 - (-23,0) = +117,0 dB', typeof off === 'number' && near(off, 117.01, 0.6), JSON.stringify(cals));
    check('nach Kalibrierung: Anzeige 94,0 dB(A), Badge "kalibriert"', near(num('m-value'), 94, 0.7) && /dB\(A\)/.test($('m-unit').textContent) && /^kalibriert/.test($('m-cal-badge').textContent), $('m-value').textContent + ' ' + $('m-unit').textContent + ' / ' + $('m-cal-badge').textContent);
    check('Kalibrier-Meldung sichtbar', /Kalibriert: 94\.0/.test($('m-notice').textContent), $('m-notice').textContent);
    check('Skala wechselt auf dB SPL (30 ... 130)', /^30/.test($('m-bar-scale').firstChild.textContent) && /130$/.test($('m-bar-scale').lastChild.textContent), $('m-bar-scale').textContent);
    await until(() => seconds() > 0 && st().meter.snapshot().w.A.leq > -Infinity, 3000);

    // ---- Grenzwert ----
    $('m-limit').value = '90'; $('m-limit').dispatchEvent(new Event('change', { bubbles: true }));
    $('m-limit-on').checked = true; $('m-limit-on').dispatchEvent(new Event('change', { bubbles: true }));
    await sleep(300);
    check('Grenzwert 90 dB(A) bei 94 dB: Pegel rot', $('m-value').classList.contains('over') && !$('m-bar-limit').hidden);
    $('m-limit').value = '96'; $('m-limit').dispatchEvent(new Event('change', { bubbles: true })); await sleep(300);
    check('Grenzwert 96 dB(A) bei 94 dB (2 dB darunter): Pegel gelb', $('m-value').classList.contains('near'));
    $('m-limit').value = '99'; $('m-limit').dispatchEvent(new Event('change', { bubbles: true })); await sleep(300);
    check('Grenzwert 99 dB(A): keine Warnung', !$('m-value').classList.contains('over') && !$('m-value').classList.contains('near'));
    $('m-limit-on').checked = false; $('m-limit-on').dispatchEvent(new Event('change', { bubbles: true }));

    // ---- Pegelverlauf und Protokoll (Kalibrierung ist noch aktiv: 94 dB) ----
    await until(() => st().meter.chains[0].count >= 4, 8000);
    Measure.drawHist();
    const hh = st().meter.history('A');
    check('Verlauf: mindestens 3 volle Sekunden, Werte um 94 dB (kalibriert)', hh.values.length >= 3 && hh.values.slice(-3).every((v) => near(v + 117.01, 94, 1)), hh.values.map((v) => (v + 117.01).toFixed(1)).join(' '));
    check('Verlauf: Zeichenfläche und Kopfzeile "Max ... Leq ..."', /Max 9\d[.,]\d/.test($('m-hist-read').textContent) && /Leq/.test($('m-hist-read').textContent), $('m-hist-read').textContent);
    $('m-hist-save').click(); await sleep(150);
    const saved = window.__saved;
    const rows = saved ? saved.text.split('\r\n') : [];
    check('Protokoll: Dateiname Pegelprotokoll_...csv', saved && /^Pegelprotokoll_\d{4}-\d{2}-\d{2}_\d{4}\.csv$/.test(saved.name), saved && saved.name);
    check('Protokoll: Kopf mit Eingang, Bewertung A, kalibriert ja, Dauer', /Bewertung;A/.test(saved.text) && /Kalibriert;ja, Offset 117,0/.test(saved.text) && /Dauer;\d+ s/.test(saved.text) && /Eingang;.+/.test(saved.text), rows.slice(0, 8).join(' | '));
    const table = rows.slice(rows.findIndex((r) => r.startsWith('Uhrzeit')) + 1).filter(Boolean);
    check('Protokoll: eine Zeile je Sekunde mit Uhrzeit, Sekunde und Wert mit Dezimalkomma (~94,0)', table.length >= 3 && /^\d\d:\d\d:\d\d;\d+;9\d,\d$/.test(table[table.length - 1]), table.length + ' Zeilen, letzte: ' + table[table.length - 1]);
    check('Protokoll: Leq gesamt und Spitze im Kopf', /Leq gesamt \(dB\(A\)\);9\d,\d/.test(saved.text) && /Spitze \(dB\(A\)\);9\d,\d/.test(saved.text));

    // ---- Zurücksetzen ----
    $('m-reset').click(); await sleep(200);
    check('Zurücksetzen (↺): Maximum beginnt neu (Wert nahe am aktuellen Pegel)', near(num('m-max'), 94, 1.5), $('m-max').textContent);

    // ---- Falsche Werte bei Stille? Kalibrierung ohne Signal wird abgelehnt (Prüfung der Grenze) ----
    // (wird in der Rechnungs-Prüfung abgedeckt; hier: Zurücksetzen der Kalibrierung)
    $('m-cal-reset').click(); await sleep(200);
    check('Kalibrierung zurücksetzen: wieder dBFS', /dBFS/.test($('m-unit').textContent) && /nicht/.test($('m-cal-badge').textContent));

    // ---- REW-Knopf hält die Messung an ----
    document.getElementById('rew-btn').click(); await sleep(300);
    check('REW öffnen (Knopf oben): Aufruf erfolgt, Live-Pegel angehalten', window.__calls.includes('rewOpen') && !st().running && /Start/.test($('m-start').textContent) && !/Stopp/.test($('m-start').textContent), JSON.stringify(window.__calls));
    const tracksEnded = !st().cap;
    check('Mikrofon nach dem Stoppen freigegeben', tracksEnded);
    $('m-gear').click(); $('m-rew-choose').click(); $('m-rew-dl').hidden = false; $('m-rew-dl').click(); await sleep(100);
    check('REW wählen / herunterladen rufen den Hauptprozess', window.__calls.includes('rewChoose') && window.__calls.includes('rewDownload'), JSON.stringify(window.__calls));

    // ---- Ersatzweg ohne AudioWorklet ----
    Measure.forceScriptProcessor = true;
    await Measure.start();
    const okSP = await until(() => seconds() >= 3, 15000);
    await sleep(300);
    check('Ersatzweg (ScriptProcessor): läuft und misst -23,0 dBFS', okSP && st().cap.mode === 'scriptprocessor' && near(num('m-value'), -23.01, 0.6), st().cap && st().cap.mode + ' ' + $('m-value').textContent);
    Measure.forceScriptProcessor = false;
    if(params.get('shot')){                                    // Bildschirmfoto: kalibriert, Grenzwert an, Messung läuft
      $('m-limit').value = '99'; $('m-limit').dispatchEvent(new Event('change', { bubbles: true }));
      $('m-limit-on').checked = true; $('m-limit-on').dispatchEvent(new Event('change', { bubbles: true }));
      $('m-cal').click(); await until(() => !st().calibrating, 15000); await sleep(2500);
    }
    if(!params.get('shot')){
      Measure.stop();
      check('Stoppen: Aufnahme beendet', !st().running && !st().cap);
    }
    // ---- Verlassen der Seite stoppt die Messung ----
    if(!params.get('shot')){
      await Measure.start(); await until(() => seconds() > 0.5, 8000);
      Measure.hide();
      check('Seite verlassen (Reiter-Wechsel) stoppt die Messung', !st().running && !st().cap);
    }
  } catch (e) {
    fails++; out.push('FAIL  Ausnahme: ' + (e && e.stack || e));
  }
  out.push(fails ? '==> ' + fails + ' FEHLER' : '==> alle Tests bestanden');
  $('out').textContent = out.join('\n');
  try { await fetch('http://127.0.0.1:8811/result', { method: 'POST', mode: 'no-cors', body: out.join('\n') }); } catch (e) {}
})();
</script>
<script src="http://127.0.0.1:8811/wait"></script>
</body></html>
