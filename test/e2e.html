<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../renderer/style.css"></head><body>
<header class="topbar"><div class="brand"><span class="brand-mark"></span><span class="brand-text">X32 <b>Fernsteuerung</b></span><span id="version-label" class="version-label"></span></div>
<div class="conn-row"><button id="rew-btn" class="btn secondary small">REW öffnen</button><button id="scan-btn" class="btn secondary small">Pult suchen</button><input id="ip-input" type="text" placeholder="192.168.0.64" /><button id="connect-btn" class="btn small">Verbinden</button>
<div id="status-badge" class="badge"><span id="pulse-dot" class="pulse-dot"></span><span id="status-text">nicht verbunden</span></div></div></header>
<nav id="layer-tabs" class="layer-tabs"></nav>
<section id="overview" class="overview"></section>
<div id="console" class="console offline"><main id="app" class="app"></main><aside id="dock" class="dock"></aside>
<div id="connect-hint" class="connect-hint"><div class="hint-title">Nicht mit einem Pult verbunden</div><p>Mac und X32 müssen im selben Netzwerk sein.</p><button id="hint-scan-btn" class="btn">Pult suchen</button><label class="auto-row"><input id="auto-connect" type="checkbox" checked> Beim Start automatisch suchen und verbinden</label></div></div>
<section id="tools" class="tools" hidden></section>
<pre id="out" style="display:none"></pre>
<script src="../shared/osc.js"></script>
<script src="../shared/values.js"></script>
<script src="../shared/client.js"></script>
<script src="mock-console.js"></script>
<script>window.__noAutoConnect = true;</script>
<script>
// Brücke wie im Hauptprozess: echte Verbindungsschicht + simuliertes Pult, statt UDP im Speicher verbunden
const cbs = {}; let client = null, mock = null;
window.__ctl = { get client(){ return client; }, get mock(){ return mock; }, emitMeter: (id, f) => cbs.meter && cbs.meter(id, f) };
window.x32API = {
  scan: async () => [],
  connect: async () => {
    mock = new MockX32({ deliver: (u8) => client.receive(u8), latency: 2 });
    if (window.__mockInit) window.__mockInit(mock);
    client = new X32Client({
      send: (u8) => mock.receive(u8),
      onBatch: (e) => cbs.batch && cbs.batch(e),
      onMeter: (id, f) => cbs.meter && cbs.meter(id, f),
      onStatus: (s) => cbs.status && cbs.status(s),
    });
    client.start();
    return { ok: true };
  },
  disconnect: async () => { if (client) client.stop(); },
  snapshot: async () => (client ? client.snapshot() : []),
  set: (p, t, v) => client && client.set(p, t, v),
  want: (p) => client && client.want(p), setHot: (p) => client && client.setHot(p), refresh: (p, u) => client && client.refresh(p, u),
  setMeters: (s) => client && client.setMeters(s),
  setSubs: (s) => client && client.setSubs(s),
  networkTest: () => new Promise((res) => { if (!client || !client.runNetworkTest(res)) res(null); }),
  onBatch: (cb) => { cbs.batch = cb; }, onMeter: (cb) => { cbs.meter = cb; }, onStatus: (cb) => { cbs.status = cb; }, onLog: () => {},
  micStatus: async () => 'denied', micRequest: async () => 'denied', openMicSettings: async () => true,
  rewStatus: async () => ({ found: false, path: null }), rewOpen: async () => ({ ok: false, notFound: true }), rewChoose: async () => ({ ok: false, canceled: true }), rewDownload: async () => true,
  getVersion: async () => '2.0.0', installUpdate: async () => ({ ok: true }),
  onUpdateAvailable: () => {}, onUpdateProgress: () => {}, onUpdateError: () => {},
};
</script>
<script src="../renderer/icons.js"></script>
<script src="../renderer/store.js"></script>
<script src="../renderer/fader.js"></script>
<script src="../shared/spl.js"></script>
<script src="../shared/calc.js"></script>
<script src="../renderer/measure.js"></script>
<script src="../renderer/tools.js"></script>
<script src="../renderer/overview.js"></script>
<script src="../renderer/changelog.js"></script>
<script src="../renderer/app.js"></script>
<script src="../renderer/scenes.js"></script>
<script src="../renderer/processing.js"></script>
<script src="e2e-scenario.js"></script>
</body></html>
