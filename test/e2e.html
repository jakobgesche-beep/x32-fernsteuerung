<script>window.__noAutoConnect = true;</script>
<script>
// Brücke wie im Hauptprozess: echte Verbindungsschicht + simuliertes Pult, statt UDP im Speicher verbunden
const cbs = {}; let client = null, mock = null;
window.__ctl = { get client(){ return client; }, get mock(){ return mock; }, emitMeter: (id, f) => cbs.meter && cbs.meter(id, f) };
window.__calls = { scan: 0, connect: [], diagnose: [], openPrivacy: 0, openFirewall: 0, openLog: 0, terminal: [], log: 'Zeile 1: Verbinden mit 10.0.0.5\nZeile 2: Keine Antwort' };
window.__scanResult = { results: [], ifaces: [] }; window.__connectResult = null; window.__diagResult = null; window.__terminalResult = null;
{ const q = new URLSearchParams(location.search); try { if (q.get('seedip')) localStorage.setItem('x32-ip', q.get('seedip')); if (q.get('seedok')) localStorage.setItem('x32-ip-ok', q.get('seedok')); } catch (e) {} }
window.x32API = {
  scan: async () => { window.__calls.scan++; return window.__scanResult; },
  diagnose: async (ip, opts) => { window.__calls.diagnose.push([ip, opts]); return typeof window.__diagResult === 'function' ? window.__diagResult(ip, opts) : window.__diagResult; },
  terminalTest: async (ip) => { window.__calls.terminal.push(ip); return window.__terminalResult || { ok: true, replied: true }; },
  netAccess: async (force) => { window.__calls.netAccess = (window.__calls.netAccess || 0) + 1; return window.__netAccess || { blocked: false }; }, onNetAccess: (cb) => { window.__netAccessCb = cb; },
  getLog: async () => window.__calls.log, openLog: async () => { window.__calls.openLog++; return true; }, openPrivacy: async () => { window.__calls.openPrivacy++; return true; }, openFirewall: async () => { window.__calls.openFirewall++; return true; },
  connect: async (ip) => {
    window.__calls.connect.push(ip);
    if (window.__connectResult) return window.__connectResult;
    mock = new MockX32({ deliver: (u8) => client.receive(u8), latency: 2 });
    if (window.__mockInit) window.__mockInit(mock);
    client = new X32Client({
      send: (u8) => mock.receive(u8),
      onBatch: (e) => cbs.batch && cbs.batch(e),
      onMeter: (id, f) => cbs.meter && cbs.meter(id, f),
      onStatus: (s) => cbs.status && cbs.status(s),
    });
    client.start();
    return { ok: true, ip };
  },
  disconnect: async () => { if (client) client.stop(); },
  snapshot: async () => (client ? client.snapshot() : []),
  set: (p, t, v) => client && client.set(p, t, v),
  want: (p) => client && client.want(p), setHot: (p) => client && client.setHot(p), refresh: (p, u) => client && client.refresh(p, u),
  setMeters: (s) => client && client.setMeters(s),
  setSubs: (s) => client && client.setSubs(s),
  networkTest: () => new Promise((res) => { if (!client || !client.runNetworkTest(res)) res(null); }),
  onBatch: (cb) => { cbs.batch = cb; }, onMeter: (cb) => { cbs.meter = cb; }, onStatus: (cb) => { cbs.status = cb; }, onLog: () => {},
  micStatus: async () => 'denied', micRequest: async () => 'denied', openMicSettings: async () => true,
  rewStatus: async () => ({ found: false, path: null }), rewOpen: async () => ({ ok: false, notFound: true }), rewChoose: async () => ({ ok: false, canceled: true }), rewDownload: async () => true,
  toggleFullscreen: async () => { window.__fullCalls = (window.__fullCalls || 0) + 1; return true; },
  getVersion: async () => '2.0.0', installUpdate: async () => ({ ok: true }),
  onUpdateAvailable: () => {}, onUpdateProgress: () => {}, onUpdateError: () => {},
};
</script>
